<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSurf - Sustentabilidade no Campo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>AgroSurf 🌾</h1>
  <p>Use as setas ⬅️ e ➡️ para se mover</p>

  <div id="game-container">
    <div id="hud">Pontos: <span id="score">0</span></div>

    <div class="lane"></div>
    <div class="lane"></div>
    <div class="lane"></div>

    <div id="player" class="entity">👨‍🌾</div>

    <!-- Modal do Questionário -->
    <div id="quiz-modal">
      <h2 id="question-text">Pergunta...</h2>
      <div id="options-container" style="width: 100%;"></div>
      <div id="feedback"></div>
    </div>

    <!-- Tela de Game Over -->
    <div id="game-over">
      <h2>Fim de Jogo! 🚜</h2>
      <p>Uma praga ou máquina atingiu você.</p>
      <p>Pontuação Final: <span id="final-score">0</span></p>
      <button onclick="restartGame()">Jogar Novamente</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
